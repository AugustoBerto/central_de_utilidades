name: Install notes dependencies

on:
  push:
    branches:
      - merge/ux-session-device-details
    paths:
      - .github/workflows/install-notes-dependencies.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: merge/ux-session-device-details

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install editor and Markdown dependencies
        run: npm install --workspace frontend codemirror @codemirror/lang-markdown markdown-it dompurify highlight.js

      - name: Validate dependency installation
        run: |
          npm run test --workspace frontend
          npm run build --workspace frontend

      - name: Commit generated manifests
        run: |
          if git diff --quiet -- frontend/package.json package-lock.json; then
            echo "Dependency manifests are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json package-lock.json
          git commit -m "build(frontend): add notes workspace dependencies"
          git push origin HEAD:merge/ux-session-device-details
