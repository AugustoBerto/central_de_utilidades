name: Validate

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: write
  statuses: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run validation commands
        id: validate
        shell: bash
        run: |
          mkdir -p validation-reports
          set +e
          npm run lint > validation-reports/lint.txt 2>&1
          lint_status=$?
          npm test > validation-reports/test.txt 2>&1
          test_status=$?
          npm run build > validation-reports/build.txt 2>&1
          build_status=$?
          set -e
          cat validation-reports/lint.txt
          cat validation-reports/test.txt
          cat validation-reports/build.txt
          if [ "$lint_status" -ne 0 ] || [ "$test_status" -ne 0 ] || [ "$build_status" -ne 0 ]; then
            exit 1
          fi
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: validation-reports
      - name: Publish validation status
        if: always()
        uses: actions/github-script@v7
        env:
          VALIDATION_STATE: ${{ steps.validate.outcome == 'success' && 'success' || 'failure' }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: process.env.VALIDATION_STATE,
              context: 'Validate / quality',
              description: process.env.VALIDATION_STATE === 'success'
                ? 'Lint, tests and build passed.'
                : 'Lint, tests or build failed.'
            });
      - name: Remove non-master branches
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.validate.outcome == 'success'
        shell: bash
        run: |
          git ls-remote --heads origin \
            | awk '{ sub("refs/heads/", "", $2); print $2 }' \
            | while IFS= read -r branch; do
                if [ "$branch" != "master" ]; then
                  git push origin --delete "$branch"
                fi
              done
